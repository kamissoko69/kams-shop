services:

  kams-stock-db:

    image: postgres:15-alpine

    container_name: kams-stock-db

    environment:
      POSTGRES_USER: kams_admin
      POSTGRES_PASSWORD: kams_secure_pass
      POSTGRES_DB: kams_stock_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    restart: unless-stopped


  kams-stock-backend:

    build:
      context: ./backend

    container_name: kams-stock-backend

    environment:
      PORT: 5000
      DB_HOST: kams-stock-db
      DB_USER: kams_admin
      DB_PASSWORD: kams_secure_pass
      DB_NAME: kams_stock_db
      DB_PORT: 5432

    depends_on:
      - kams-stock-db

    restart: unless-stopped


  kams-stock-nginx:

    build:
      context: ./frontend

    container_name: kams-stock-nginx

    ports:
      - "8080:80"

    depends_on:
      - kams-stock-backend

    restart: unless-stopped


volumes:

  postgres_data: